<h2>Get and Set Input field</h2>
<div style="text-align: center">
  <h3>{{ username }}</h3>
  <input
    value="{{ username }}"
    #usernameField
    type="text"
    placeHolder="enter user name"
    (input)="getUserName($event)"
  />
  <br /><br />
  <button (click)="setUsername()" style="margin: 10px">Set User Name</button>
  <button (click)="getUsernameWithTemplate(usernameField.value)">
    Get User Name
  </button>
</div>
